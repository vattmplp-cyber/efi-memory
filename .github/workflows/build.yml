name: Build Client EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Install ATL Component
      run: |
        $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
        $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
        if ($installer -and $vsPath) {
            Write-Host "Installing ATL component for VS at: $vsPath"
            & $installer modify --installPath "$vsPath" --add Microsoft.VisualStudio.Component.VC.ATL --passive --norestart
        } else {
            Write-Error "Visual Studio installer not found!"
            exit 1
        }

    - name: Find and Build Solution or Project
      run: |
        $file = Get-ChildItem -Recurse -Include *.sln, *.vcxproj | Select-Object -First 1
        if ($file) {
            Write-Host "Found file: $($file.FullName)"
            msbuild $file.FullName /p:Configuration=Release /p:Platform=x64
        } else {
            Write-Error "No .sln or .vcxproj file found in the repository!"
            exit 1
        }

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: client-exe
        path: |
          **/Release/*.exe
          **/x64/Release/*.exe
