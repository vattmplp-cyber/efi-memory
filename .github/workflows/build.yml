name: Build Client EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Bypass ATL Dependency and Fix Warnings
      shell: pwsh
      run: |
        $dir = "client/efi-mapper/kdmapper"
        
        # Створюємо шим для atlstr.h
        $shim = @'
        #pragma once
        #include <string>
        #include <windows.h>

        class CString : public std::wstring {
        public:
            CString() : std::wstring() {}
            CString(const wchar_t* s) : std::wstring(s ? s : L"") {}
            CString(const std::wstring& s) : std::wstring(s) {}
            CString(const char* s) {
                if (s) {
                    int len = MultiByteToWideChar(CP_ACP, 0, s, -1, NULL, 0);
                    wchar_t* buf = new wchar_t[len];
                    MultiByteToWideChar(CP_ACP, 0, s, -1, buf, len);
                    assign(buf);
                    delete[] buf;
                }
            }
            operator const wchar_t*() const { return c_str(); }
            bool IsEmpty() const { return empty(); }
        };
        '@
        
        Set-Content -Path "$dir/atlstr.h" -Value $shim -Encoding UTF8
        
        # Виправляємо інклуд у заголовному файлі
        $hp = "$dir/efi_driver.hpp"
        $c = Get-Content $hp -Raw
        $c = $c -replace '#include\s*<atlstr\.h>', '#include "atlstr.h"'
        Set-Content -Path $hp -Value $c -Encoding UTF8

        # Патчимо vcxproj, щоб вимкнути TreatWarningAsError та ігнорувати попередження 4100
        $proj = "$dir/kdmapper.vcxproj"
        $projContent = Get-Content $proj -Raw
        $projContent = $projContent -replace '<TreatWarningAsError>true</TreatWarningAsError>', '<TreatWarningAsError>false</TreatWarningAsError>'
        $projContent = $projContent -replace '<WarningLevel>W4</WarningLevel>', '<WarningLevel>W4</WarningLevel><DisableSpecificWarnings>4100</DisableSpecificWarnings>'
        Set-Content -Path $proj -Value $projContent -Encoding UTF8

    - name: Build kdmapper
      run: msbuild client/efi-mapper/kdmapper/kdmapper.vcxproj /p:Configuration=Release /p:Platform=x64

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: client-exe
        path: client/efi-mapper/kdmapper/x64/Release/*.exe
