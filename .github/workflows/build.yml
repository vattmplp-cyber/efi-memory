name: Build Client EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Fix Project Configuration for Latest Toolset
      run: |
        $projFile = Get-ChildItem -Recurse -Include *.vcxproj | Select-Object -First 1
        if ($projFile) {
            Write-Host "Updating PlatformToolset in: $($projFile.FullName)"
            [xml]$xml = Get-Content $projFile.FullName
            # Змінюємо версію інструментів на поточну системну, щоб уникнути конфліктів ATL
            foreach ($pg in $xml.Project.PropertyGroup) {
                if ($pg.PlatformToolset) {
                    $pg.PlatformToolset = $(& "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationVersion)
                    # Або скидаємо на стандартний за замовчуванням
                }
            }
            # Простіший підхід через заміну тексту, щоб не ламати структуру XML
            $content = Get-Content $projFile.FullName -Raw
            $content = $content -replace '<PlatformToolset>v142</PlatformToolset>', '<PlatformToolset>v143</PlatformToolset>'
            Set-Content $projFile.FullName -Value $content
        }

    - name: Find and Build Solution or Project
      run: |
        $file = Get-ChildItem -Recurse -Include *.sln, *.vcxproj | Select-Object -First 1
        if ($file) {
            Write-Host "Found file: $($file.FullName)"
            msbuild $file.FullName /p:Configuration=Release /p:Platform=x64
        } else {
            Write-Error "No .sln or .vcxproj file found in the repository!"
            exit 1
        }

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: client-exe
        path: |
          **/Release/*.exe
          **/x64/Release/*.exe
